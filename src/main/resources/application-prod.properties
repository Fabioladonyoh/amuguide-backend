spring.application.name=amuguide-backend
spring.datasource.url=${AMUGUIDE_DB_URL}
spring.datasource.username=${AMUGUIDE_DB_USERNAME}
spring.datasource.password=${AMUGUIDE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

amuguide.cors.allowed-origins=${AMUGUIDE_CORS_ALLOWED_ORIGINS}
spring.servlet.multipart.max-file-size=${AMUGUIDE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${AMUGUIDE_MAX_REQUEST_SIZE:10MB}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
