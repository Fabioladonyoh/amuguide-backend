spring.application.name=amuguide-backend
spring.profiles.active=dev
server.port=8081

# Keep data.sql as a reference fixture only; it must not reseed demo data over official imports.
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=${AMUGUIDE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${AMUGUIDE_MAX_REQUEST_SIZE:10MB}
amuguide.cors.allowed-origins=${AMUGUIDE_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Demo/legacy seeders are disabled by default so official AMU/INAM imports remain the public source of truth.
amuguide.seed.demo.enabled=false
amuguide.seed.reference-prestations.enabled=false
amuguide.seed.partner-pharmacies.enabled=false
amuguide.seed.legacy-medicaments.enabled=false
