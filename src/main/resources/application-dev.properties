spring.application.name=amuguide-backend
amuguide.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

spring.datasource.url=${AMUGUIDE_DB_URL:jdbc:postgresql://localhost:5432/amu_guide_db}
spring.datasource.username=${AMUGUIDE_DB_USERNAME:postgres}
spring.datasource.password=${AMUGUIDE_DB_PASSWORD}



# ── Datasource Supabase ─────────────────────────────────────────────────────
#spring.datasource.url=${AMUGUIDE_SUPABASE_DB_URL:}
#spring.datasource.username=${AMUGUIDE_SUPABASE_DB_USERNAME:}
#spring.datasource.password=${AMUGUIDE_SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection Pool (HikariCP) ──────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Init SQL (décommenter si besoin) ────────────────────────────────────────
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# Clé HMAC-SHA256 encodée en Base64 (minimum 32 octets / 256 bits)
# IMPORTANT : changer cette valeur en production !
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.servlet.multipart.max-file-size=${AMUGUIDE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${AMUGUIDE_MAX_REQUEST_SIZE:10MB}

# ── Swagger / SpringDoc ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

# Chatbot IA agentique : auto, none, openai, gemini ou ollama
# En mode auto, le backend essaie OpenAI si OPENAI_API_KEY existe,
# puis Gemini si GEMINI_API_KEY existe, puis Ollama local.
# Sans cle ni Ollama, le chatbot garde son raisonnement local.
chatbot.ai.provider=${CHATBOT_AI_PROVIDER:auto}
chatbot.ai.openai.api-key=${OPENAI_API_KEY:}
chatbot.ai.openai.model=${OPENAI_MODEL:gpt-5.2}
chatbot.ai.gemini.api-key=${GEMINI_API_KEY:}
chatbot.ai.gemini.model=gemini-1.5-flash
chatbot.ai.ollama.url=http://localhost:11434
chatbot.ai.ollama.model=llama3.2
